# Déployé par l'outil deployer_ci.py du dépôt agrégateur — modifier le modèle, pas ce fichier.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  controles:
    name: Catalogue, skills et secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/controles.py
